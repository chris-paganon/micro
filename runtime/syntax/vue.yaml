filetype: vue

detect:
    filename: "\\.vue$"

rules:
    - default:
        start: "<script.* lang=(ts|'ts'|\"ts\").*>$"
        end: "</script>"
        rules:
            - include: "typescript"

    - default:
        start: "<script.*>$"
        end: "</script>"
        rules:
            - include: "javascript"

    - default:
        start: "<style[^>]*>"
        end: "</style>"
        rules:
            - include: "css"

    - comment.block:
        start: "<!--"
        end: "-->"
        rules:
            - todo: "(TODO|FIXME|NOTE):?"

    - default:
        start: "{{"
        end: "}}"
        rules:
            - include: "javascript"

    - symbol.tag: "</[A-Za-z][A-Za-z0-9_.:-]*[ \\t]*>"

    # A region allows attributes on later lines and arbitrary component names.
    - symbol.tag:
        start: "<[A-Za-z][A-Za-z0-9_.:-]*"
        end: "/?>"
        # don't end on a `>` inside quotes like <div data-content="a<b>c">
        skip: "\"([^\"\\\\]|\\\\.)*\"|'([^'\\\\]|\\\\.)*'"
        rules:
            - identifier: "[A-Za-z_][A-Za-z0-9_.:@#\\[\\]-]*"
            # Leave custom v-* attributes as identifiers so typos stand out.
            - special: '(^|[ \t])v-(else-if|text|html|show|if|else|for|on|bind|model|slot|pre|once|memo|cloak)(:[A-Za-z_][A-Za-z0-9_-]*)?(\.[A-Za-z_][A-Za-z0-9_-]*)*\b'
            - special: '(^|[ \t])v-(on|bind|model|slot):\[[^ \t]+\](\.[A-Za-z_][A-Za-z0-9_-]*)*'
            - special: '(^|[ \t])[@:#]([A-Za-z_][A-Za-z0-9_-]*|\[[^ \t]+\])(\.[A-Za-z_][A-Za-z0-9_-]*)*'
            - symbol: "="
            - constant.string: '"([^"\\]|\\.)*"'
            - constant.string: "'([^'\\\\]|\\\\.)*'"

    - special: "&([A-Za-z][A-Za-z0-9]*|#[0-9]+|#[xX][0-9a-fA-F]+);"
