filetype: vue

detect:
    filename: "\\.vue$"

rules:
    # Prefer TypeScript over the generic script rule at the same position.
    # Skip quoted values as units so > in a generic type does not end the tag.
    - default:
        start: "<script\\s+(?:(?:[^>\"']|\"[^\"]*\"|'[^']*')*\\s)?lang\\s*=\\s*(?:\"ts\"|'ts'|ts\\b)(?:[^>\"']|\"[^\"]*\"|'[^']*')*>"
        end: "</script[ \t]*>"
        rules:
            - include: "typescript"

    - default:
        start: "<script(?:\\s(?:[^>\"']|\"[^\"]*\"|'[^']*')*)?>"
        end: "</script[ \t]*>"
        rules:
            - include: "javascript"

    - default:
        start: "<style(?:\\s(?:[^>\"']|\"[^\"]*\"|'[^']*')*)?>"
        end: "</style[ \t]*>"
        rules:
            - include: "css"

    # Keep template tags at the top level so nested <template> elements do not
    # end the highlighting of the surrounding template.
    - comment.block:
        start: "<!--"
        end: "-->"
        rules:
            - todo: "(TODO|FIXME|NOTE):?"

    - default:
        start: "{{"
        end: "}}"
        rules:
            - include: "javascript"

    # A region allows attributes on later lines and arbitrary component names.
    - symbol.tag:
        start: "</?[A-Za-z][A-Za-z0-9_.:-]*"
        end: "/?>"
        rules:
            - identifier: "[A-Za-z_:@#][A-Za-z0-9_.:@#\\[\\]-]*"
            - symbol: "="
            - constant.string:
                start: '"'
                end: '"'
                rules: []
            - constant.string:
                start: "'"
                end: "'"
                rules: []

    - special: "&([A-Za-z][A-Za-z0-9]*|#[0-9]+|#[xX][0-9a-fA-F]+);"
