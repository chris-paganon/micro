filetype: vue

detect:
    filename: "\\.vue$"

rules:
    - default:
        start: "<script.* lang=(ts|'ts'|\"ts\").*>$"
        end: "</script>"
        rules:
            - include: "typescript"

    - default:
        start: "<script.*>$"
        end: "</script>"
        rules:
            - include: "javascript"

    - default:
        start: "<style[^>]*>"
        end: "</style>"
        rules:
            - include: "css"

    - comment.block:
        start: "<!--"
        end: "-->"
        rules:
            - todo: "(TODO|FIXME|NOTE):?"

    - default:
        start: "{{"
        end: "}}"
        rules:
            - include: "javascript"

    # A region allows attributes on later lines and arbitrary component names.
    - symbol.tag:
        start: "</?[A-Za-z][A-Za-z0-9_.:-]*"
        end: "/?>"
        rules:
            - identifier: "[A-Za-z_][A-Za-z0-9_.:@#\\[\\]-]*"
            - special: "\\bv-[A-Za-z][A-Za-z0-9-]*\\b"
            - special: "[@:#][A-Za-z_][A-Za-z0-9_-]*(\\.[A-Za-z_][A-Za-z0-9_-]*)*"
            - symbol: "="
            - constant.string:
                start: '"'
                end: '"'
                rules: []
            - constant.string:
                start: "'"
                end: "'"
                rules: []

    - special: "&([A-Za-z][A-Za-z0-9]*|#[0-9]+|#[xX][0-9a-fA-F]+);"
